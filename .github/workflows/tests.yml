name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    # 依赖 winreg / ctypes.wintypes / PyQt5 桌面栈，收集阶段需 Windows runner
    name: tests + contracts + evaluation (windows-latest)
    runs-on: windows-latest
    # 整个 job 的硬上限。默认是 6 小时，出问题时等于白烧额度、也看不到反馈。
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen   # 无桌面会话下让 Qt 以离屏模式加载
      PYTHONIOENCODING: utf-8      # 规避 GBK 控制台在打印中文/emoji 断言行时崩溃
      # 注意：LINGLING_DATA_DIR 不能写在这里。job 级 env 只允许
      # github / needs / strategy / matrix / vars / secrets / inputs 七个 context，
      # runner 不在合法列表中（runner 仅可用于 steps.* 等位置）。
      # 一旦在这种位置引用 runner 的 temp 目录，workflow 解析阶段即判无效，
      # run 会在 3 秒内 failure 且不产生任何 job。故改由下面的步骤注入。
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated data dir
        # 轨迹 / 偏好 / 规则 / 记忆 / 任务台全部落到 runner 临时目录，
        # CI 不写脏工作区，也让每轮测试从干净状态开始。
        # 通过 $GITHUB_ENV 注入：step 级允许使用 runner context。
        shell: bash
        run: echo "LINGLING_DATA_DIR=${RUNNER_TEMP}/lingling-data" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies (real install, no hand-picked list)
        # 刻意走完整的 requirements 链：以前 CI 手工列包、绕开 requirements.txt，
        # 导致 PyTorch 这种错误包名永远发现不了。这里让 CI 与用户安装路径一致。
        #
        # 分段 + 计时 + 硬超时：首次运行在 Windows runner 上出现过「pip 无任何输出地
        # 挂住 25 分钟以上」，默认 job 超时 6 小时会白等。这里给 18 分钟（正常 5-15
        # 分钟足够，覆盖 PyQt5 + WebEngine 约 110MB 的冷启动），超时即红并留下分段计时，
        # 能直接看出卡在 api 依赖还是桌面依赖。
        timeout-minutes: 18
        shell: bash
        run: |
          t0=$(date +%s)
          echo "===== [1/2] requirements-api.txt ====="
          python -m pip install -r requirements-api.txt
          echo "[1/2] ok in $(( $(date +%s) - t0 ))s"

          t1=$(date +%s)
          echo "===== [2/2] requirements-dev.txt (含桌面 UI / 文档工厂 / 数据分析) ====="
          python -m pip install -r requirements-dev.txt
          echo "[2/2] ok in $(( $(date +%s) - t1 ))s"

          echo "===== 关键包版本（失败时对照本地环境）====="
          python -m pip list 2>/dev/null | grep -Ei "pyqt|pandas|matplotlib|pytest|fastapi|pillow|pyinstaller" || true

      - name: Syntax check
        run: python -m compileall -q framework api ui tools tests

      - name: Contract checks (action pool / effects / persona / adaptive wiring)
        # 失败时把每条 [FAIL] 顶成 check-run annotation。
        # 动机：Actions 日志要登录才能下载，而 annotations 在公开仓库可匿名读取，
        # 定位「哪条契约红了、真实值是多少」不必先拿到 token。
        shell: bash
        run: |
          set +e
          python tools/check_contracts.py > contracts.log 2>&1
          code=$?
          cat contracts.log
          if [ "$code" -ne 0 ]; then
            grep -F "[FAIL]" contracts.log | head -20 | while IFS= read -r line; do
              echo "::error title=契约检查::${line}"
            done
          fi
          exit "$code"

      - name: Unit tests
        run: python -m pytest -q --cov=framework --cov-report=term-missing:skip-covered

      - name: Startup smoke test
        run: python main.py --selftest

      - name: Integration self-check (157 checks, zero-LLM replay)
        run: python tools/test_agent_features.py

      - name: Capability evaluation
        # 落盘 markdown 供 README / 简历引用；退出码即卡口。
        run: |
          python tools/eval_tasks.py --json docs/eval/capability.json --md docs/eval/capability.md

      - name: Adaptive benchmark (before/after learning)
        # 32 条带扰动任务，固定种子；断言「学完真的比没学之前好」，
        # 并如实保留若干硬失败样本，不用全满分蒙混过关。
        # --min-delta 10：学习后必须比学习前至少提升 10 个百分点，
        # 防止未来改动悄悄把「进化」能力改坏（这是回归阈值，不是摆设）。
        run: |
          python tools/benchmark.py --threshold 0.8 --min-delta 10 --json docs/eval/benchmark.json --md docs/eval/benchmark.md --append-history

      - name: Upload eval artifacts (history + reports)
        # runner 是一次性的：若不把 history.jsonl 上传，趋势跟踪的数据
        # 随 runner 销毁就没了。这里把历史与报告一起存成 workflow artifact，
        # 供按需下载做长期趋势对比（本地 Git 提交一份种子历史做基线）。
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            docs/eval/history.jsonl
            docs/eval/benchmark.json
            docs/eval/benchmark.md
            docs/eval/capability.json
            docs/eval/capability.md
          if-no-files-found: error
