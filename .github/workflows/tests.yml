name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    # 依赖 winreg / ctypes.wintypes / PyQt5 桌面栈，收集阶段需 Windows runner
    name: tests + contracts + evaluation (windows-latest)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen   # 无桌面会话下让 Qt 以离屏模式加载
      PYTHONIOENCODING: utf-8      # 规避 GBK 控制台在打印中文/emoji 断言行时崩溃
      # 轨迹 / 偏好 / 规则 / 记忆 / 任务台全部落到 runner 临时目录，
      # CI 不写脏工作区，也让每轮测试从干净状态开始。
      LINGLING_DATA_DIR: ${{ runner.temp }}/lingling-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies (real install, no hand-picked list)
        # 刻意走完整的 requirements 链：以前 CI 手工列包、绕开 requirements.txt，
        # 导致 PyTorch 这种错误包名永远发现不了。这里让 CI 与用户安装路径一致。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q framework api ui tools tests

      - name: Contract checks (action pool / effects / persona / adaptive wiring)
        run: python tools/check_contracts.py

      - name: Unit tests
        run: python -m pytest -q --cov=framework --cov-report=term-missing:skip-covered

      - name: Startup smoke test
        run: python main.py --selftest

      - name: Integration self-check (157 checks, zero-LLM replay)
        run: python tools/test_agent_features.py

      - name: Capability evaluation
        # 落盘 markdown 供 README / 简历引用；退出码即卡口。
        run: |
          python tools/eval_tasks.py --json docs/eval/capability.json --md docs/eval/capability.md

      - name: Adaptive benchmark (before/after learning)
        # 32 条带扰动任务，固定种子；断言「学完真的比没学之前好」，
        # 并如实保留若干硬失败样本，不用全满分蒙混过关。
        # --min-delta 10：学习后必须比学习前至少提升 10 个百分点，
        # 防止未来改动悄悄把「进化」能力改坏（这是回归阈值，不是摆设）。
        run: |
          python tools/benchmark.py --threshold 0.8 --min-delta 10 --json docs/eval/benchmark.json --md docs/eval/benchmark.md --append-history
